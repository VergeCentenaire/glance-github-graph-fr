<div id="graph-slider"
     style="overflow-x:auto;scrollbar-width: thin;padding-bottom:1rem;">
    {{ svg|safe }}
</div>

<script>
setTimeout(() => {
    const graph = document.getElementById("graph-slider");

    if (graph) {
        graph.scrollLeft = graph.scrollWidth;
        console.log("scroll applied");
    }
}, 3000);
</script>
